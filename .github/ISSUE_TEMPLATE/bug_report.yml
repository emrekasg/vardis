name: Bug report
description: Something in Vardis is wrong, slow, or broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Vardis collects no crash reports or analytics, so the details you give here are all we have.
        For security problems, do not use this form. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Apps screen
        2. Sort by memory
        3. ...
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Direct download
        - App Store
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vardis version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 26.1, MacBook Pro M3"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or logs help. Check them for private details (paths, project names, tokens) before posting.
