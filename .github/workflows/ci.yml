name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Vardis needs Xcode 26 (Swift 6.2 tools, macOS 26 SDK), which ships as the
    # default on the macos-26 image. If that image is unavailable, switch to
    # macos-15 and add a step: sudo xcode-select -s /Applications/Xcode_26.app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            Packages/VardisKit/.build
            .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/VardisKit/Package.swift', 'Packages/VardisKit/Package.resolved', 'project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Vardis (direct edition)
        run: |
          xcodebuild -project Vardis.xcodeproj -scheme Vardis \
            -configuration Debug \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            build CODE_SIGNING_ALLOWED=NO

      - name: Build VardisAppStore (sandboxed edition)
        run: |
          xcodebuild -project Vardis.xcodeproj -scheme VardisAppStore \
            -configuration Debug \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            build CODE_SIGNING_ALLOWED=NO

      - name: Test VardisKit
        working-directory: Packages/VardisKit
        run: swift test
