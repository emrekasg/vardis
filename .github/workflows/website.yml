name: Website

# Deploys website/ to the `vardis` Worker (static assets on vardis.app) with the cf CLI.
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers Routes/Custom Domains:Edit on the zone)
#          CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - name: No third-party requests in the site
        run: |
          if grep -rEho 'https?://[^"'"'"' )]+' public --include='*.html' --include='*.css' --include='*.js' \
             | grep -vE '^https?://(vardis\.app|www\.vardis\.app|github\.com/emrekasg)' | grep -q .; then
            echo "External URL found in the site:"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund
        if: env.HAS_TOKEN == 'true'

      - name: Skip deploy (no CLOUDFLARE_API_TOKEN secret)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy from CI."

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy --message "${GITHUB_SHA::7}"
