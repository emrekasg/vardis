name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy vardis.app to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check for third-party requests
        run: |
          # The site must load nothing from other origins.
          if grep -nE '(src|href|url\()=?["'"'"'(]?https?://' website/*.html website/*.css \
              | grep -vE 'https://(vardis\.app|github\.com)/'; then
            echo "Found an external resource reference." && exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=vardis --branch=main
