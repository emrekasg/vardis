name: Release

# Runs when a version tag is pushed (scripts/bump-version.sh creates it):
#   git push origin main --tags
#
# Optional secrets (names only; without them the app is ad-hoc signed and not notarized):
#   DEVELOPER_ID_CERT_P12        base64 of the Developer ID Application .p12
#   DEVELOPER_ID_CERT_PASSWORD   its password
#   DEVELOPER_ID_IDENTITY        e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_TEAM_ID                Apple Developer team id
#   NOTARY_APPLE_ID              Apple ID for notarytool
#   NOTARY_APP_PASSWORD          app-specific password for that Apple ID
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (App Store upload job)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct:
    name: Direct download (DMG + zip)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' }}
    outputs:
      has_asc: ${{ steps.flags.outputs.has_asc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: flags
        run: echo "has_asc=$HAS_ASC" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: brew install xcodegen

      - name: Test
        working-directory: Packages/VardisKit
        run: |
          swift test 2>&1 | tee test.log
          grep -q "Test run with .* passed" test.log
          ! grep -q "✘" test.log

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize, package
        env:
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: scripts/build-release.sh

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on=1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Vardis $VERSION" > notes.md
          if [ "$HAS_CERT" != "true" ]; then
            cat >> notes.md <<'NOTE'

          ### Opening Vardis the first time
          This build is not notarized yet, so macOS blocks the first launch. Move Vardis to Applications, open it once, then go to System Settings › Privacy & Security and click **Open Anyway**. Or run this once in Terminal:

          ```
          xattr -dr com.apple.quarantine /Applications/Vardis.app
          ```
          NOTE
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/dist/Vardis-*.dmg build/dist/Vardis-*.zip build/dist/SHA256SUMS.txt \
            --title "Vardis ${GITHUB_REF_NAME#v}" --notes-file notes.md

  app-store:
    name: App Store upload
    runs-on: macos-26
    timeout-minutes: 60
    needs: direct
    if: startsWith(github.ref, 'refs/tags/v') && needs.direct.outputs.has_asc == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate --quiet
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project Vardis.xcodeproj -scheme VardisAppStore -configuration Release \
            -archivePath build/VardisAppStore.xcarchive -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" "${AUTH[@]}" archive
          xcodebuild -exportArchive -archivePath build/VardisAppStore.xcarchive \
            -exportOptionsPlist Config/ExportOptions-AppStore.plist -exportPath build/appstore "${AUTH[@]}"
          rm "$RUNNER_TEMP/AuthKey.p8"
