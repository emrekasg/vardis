name: Vardis
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Brand.xcconfig
  Release: Config/Brand.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  VardisKit:
    path: Packages/VardisKit
targetTemplates:
  VardisApp:
    type: application
    platform: macOS
    sources:
      - App/Sources
    resources:
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Free forever. Vardis collects nothing."
    dependencies:
      - package: VardisKit
        product: VardisCore
      - package: VardisKit
        product: VardisSampling
      - package: VardisKit
        product: VardisStore
      - package: VardisKit
        product: VardisClaude
      - package: VardisKit
        product: VardisCleanup
targets:
  Vardis:
    templates: [VardisApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VARDIS_BUNDLE_ID_BASE).direct
        CODE_SIGN_ENTITLEMENTS: App/Vardis.entitlements
  VardisAppStore:
    templates: [VardisApp]
    settings:
      base:
        PRODUCT_NAME: Vardis
        PRODUCT_BUNDLE_IDENTIFIER: $(VARDIS_BUNDLE_ID_BASE)
        CODE_SIGN_ENTITLEMENTS: App/VardisAppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPSTORE
schemes:
  Vardis:
    build:
      targets:
        Vardis: all
    test:
      config: Debug
  VardisAppStore:
    build:
      targets:
        VardisAppStore: all
